name: Build APK
on:
  push:
    branches: [wuhen-apk]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: echo "sdk.dir=$ANDROID_HOME" > local.properties && ls $ANDROID_HOME/platforms | tail -3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: wuhen-editor-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to apk-output branch
        run: |
          mkdir out && cp app/build/outputs/apk/debug/app-debug.apk out/wuhen-editor.apk
          cd out && git init -q -b apk-output
          git config user.name github-actions && git config user.email github-actions@users.noreply.github.com
          git add . && git commit -qm "APK build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}" apk-output
