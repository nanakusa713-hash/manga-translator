name: Build 越中翻譯 APK

on:
  push:
    branches: [vi-zh-translator]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk vi-zh-translator.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: vi-zh-latest
          name: 越中翻譯 App 最新版
          body: 越南文 ⇄ 中文 即時語音翻譯。用手機下載下面的 vi-zh-translator.apk 安裝即可。
          files: vi-zh-translator.apk
          make_latest: false
